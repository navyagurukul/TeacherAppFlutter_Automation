name: Android UI Tests (emulator)

# Runs the real UI suite (Login, Tabs, Lesson-Plan viewers) on a cloud Android
# emulator. Manual trigger: the app isn't committed (it's git-ignored and signed
# per-build), so you pass a URL to the APK to install. Provide SLACK_WEBHOOK_URL
# as a secret if you also want the run posted to Slack.
#
# USE THIS WHEN A NEW BUILD (APK) IS SHARED — it installs the exact APK on a
# clean emulator, so a differently-signed build can't clash with the Play Store
# app on the physical QA device (that stays reserved for the daily nightly run).
# Default markers `not heavy` = all scenarios; blank = everything incl. the long
# `heavy` sweeps. Results post to Slack and upload as artifacts.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Public URL to the teacher APK to install and test"
        required: true
      markers:
        description: "pytest -m expression. Default 'not heavy' = all scenarios. Blank = everything incl. heavy (very long)."
        required: false
        default: "not heavy"
      api_level:
        description: "Android API level for the emulator"
        required: false
        default: "33"

jobs:
  ui:
    runs-on: ubuntu-latest
    # A full run (all markers, app-clear + re-login per test on one emulator) is
    # long; give it room but stay under GitHub's 360-min hard cap.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium + UiAutomator2 driver
        # Pinned for reproducibility. The uiautomator2 driver's current line
        # (7.x/8.x) requires an Appium 3 server, so we install Appium 3 here;
        # installing appium@2 fails with a server-version mismatch. Bump both
        # together when upgrading.
        run: |
          npm i -g appium@3.5.2
          appium driver install uiautomator2@8.1.0
          appium --version

      - name: Download APK under test
        run: |
          mkdir -p apps
          curl -fSL "${{ inputs.apk_url }}" -o apps/teacher.apk
          ls -la apps

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: apps/teacher.apk
          NO_RESET: "false"
          FULL_RESET: "false"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            appium --log-timestamp --log appium.log &
            npx wait-on tcp:127.0.0.1:4723 -t 120000
            # Blank markers => full run (no -m filter, every test incl. heavy).
            # --reruns cushions the flake inherent to a long single-emulator run.
            MARKERS="${{ inputs.markers }}"
            if [ -n "$MARKERS" ]; then
              pytest -m "$MARKERS" --reruns 1 --reruns-delay 5 --junitxml=reports/junit_full.xml
            else
              echo "No marker filter -> FULL RUN (everything, including heavy)"
              pytest --reruns 1 --reruns-delay 5 --junitxml=reports/junit_full.xml
            fi

      - name: Post run summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -f reports/junit_full.xml ]; then
            python -m utils.slack_full_summary reports/junit_full.xml --scope "shared APK on emulator (-m '${{ inputs.markers }}')"
          else
            echo "No junit produced (tests may not have started); skipping Slack post."
          fi

      - name: Upload reports + Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            reports/
            appium.log
          if-no-files-found: ignore
