name: Daily QA Report

# Cloud equivalent of the Windows "TeacherApp QA Daily" task. Runs the
# device-free Lesson-Plan media audit (Lesson Plans / PDFs / Videos, validated
# against the real backend) and posts the per-area summary to Slack. No phone or
# emulator required — only outbound internet to the API + Slack.
#
# Required repo secret:  SLACK_WEBHOOK_URL   (Settings -> Secrets and variables -> Actions)
# Optional repo variable: APP_VERSION        (shown in the report header; this repo
#                         has no pubspec.yaml to auto-read, so set it here, e.g. 2.3.6.
#                         A real device run resolves it live from the login screen.)

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST (01:30 UTC) daily
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run media audit + post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APP_VERSION: ${{ vars.APP_VERSION }}
        run: python run_daily.py --audit-only

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: reports/
          if-no-files-found: ignore
